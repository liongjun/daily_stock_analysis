name: Net Check

# 仅手动触发：探测外部端点从 GitHub runner 是否可达（不需要任何密钥）
on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: DNS resolve
        run: |
          getent hosts token.lightvela.com || echo "DNS_FAIL"

      - name: TLS + HTTP status (no auth)
        run: |
          echo "--- /v1/models 无鉴权（期望 401 表示可达）---"
          code=$(curl -s -o /tmp/body.txt -w "%{http_code}" -m 25 \
            https://token.lightvela.com/v1/models || echo "000")
          echo "HTTP=$code"
          echo "BODY=$(head -c 300 /tmp/body.txt)"

      - name: Chat endpoint reachability
        run: |
          code=$(curl -s -o /tmp/c.txt -w "%{http_code}" -m 25 -X POST \
            -H "Content-Type: application/json" \
            -d '{"model":"auto","messages":[{"role":"user","content":"ping"}],"max_tokens":8}' \
            https://token.lightvela.com/v1/chat/completions || echo "000")
          echo "POST_HTTP=$code"
          echo "BODY=$(head -c 300 /tmp/c.txt)"

      - name: Timing
        run: |
          curl -s -o /dev/null -w "connect=%{time_connect}s total=%{time_total}s\n" \
            -m 25 https://token.lightvela.com/v1/models || true
