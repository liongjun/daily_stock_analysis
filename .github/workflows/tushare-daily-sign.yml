name: Tushare 每日签到

# fork 仓库长时间无提交会被 GitHub 自动停用定时任务，届时到 Actions 页面重新启用即可
on:
  schedule:
    - cron: '40 0 * * *'   # UTC 00:40 = 北京时间 08:40
  workflow_dispatch:

jobs:
  sign:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 执行签到
        env:
          TUSHARE_COOKIE: ${{ secrets.TUSHARE_COOKIE }}
        run: python scripts/tushare_sign.py
