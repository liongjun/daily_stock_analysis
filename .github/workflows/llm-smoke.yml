name: LLM Smoke Test

# 仅手动触发。用于在 GitHub Actions 的机房 IP 上验证模型通道是否可用：
#   1) key 是否有效、该 IP 是否被允许
#   2) 各模型是否可调用、延迟多少
#   3) JSON 结构化输出是否稳定（本项目强依赖）
# 不参与每日分析，不改动任何生产变量。

on:
  workflow_dispatch:
    inputs:
      models:
        description: '逗号分隔的模型名（留空用默认列表）'
        required: false
        default: 'gemini-2.5-flash,gemini-2.0-flash,gemini-2.5-flash-lite,gemini-2.5-pro'

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: 连通性 / 模型 / JSON 输出探测
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          MODELS: ${{ inputs.models }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import time
          import urllib.error
          import urllib.request

          KEY = (os.environ.get("GEMINI_API_KEY") or "").strip()
          BASE = "https://generativelanguage.googleapis.com/v1beta/openai"

          print("=" * 62)
          print("[ENV] key_len=%d prefix=%s" % (len(KEY), KEY[:4] if KEY else "EMPTY"))
          if not KEY:
              raise SystemExit("GEMINI_API_KEY 为空，检查 secret 名称是否为 GEMINI_API_KEY")


          def call(method, path, payload=None, timeout=120):
              req = urllib.request.Request(
                  BASE + path,
                  data=json.dumps(payload).encode() if payload else None,
                  method=method,
              )
              req.add_header("Authorization", "Bearer " + KEY)
              req.add_header("Content-Type", "application/json")
              t0 = time.time()
              try:
                  with urllib.request.urlopen(req, timeout=timeout) as r:
                      return r.status, r.read().decode("utf-8", "replace"), time.time() - t0
              except urllib.error.HTTPError as e:
                  return e.code, e.read().decode("utf-8", "replace"), time.time() - t0
              except Exception as e:
                  return -1, "%s: %s" % (type(e).__name__, e), time.time() - t0


          st, body, el = call("GET", "/models")
          print("[MODELS] status=%s elapsed=%.1fs" % (st, el))
          if st == 200:
              try:
                  ids = [m.get("id") for m in json.loads(body).get("data", [])]
              except Exception as e:
                  ids = []
                  print("  解析失败:", e)
              print("  可用模型共 %d 个，gemini 系：" % len(ids))
              for i in ids:
                  if "gemini" in (i or ""):
                      print("   -", i)
          else:
              print("  失败内容:", body[:400])

          wanted = [m.strip() for m in (os.environ.get("MODELS") or "").split(",") if m.strip()]
          ok = []
          for m in wanted:
              payload = {
                  "model": m,
                  "messages": [
                      {"role": "user", "content": "用一句中文说明：A股收盘后，均线多头排列意味着什么？"}
                  ],
                  "max_tokens": 200,
                  "temperature": 0.3,
              }
              st, body, el = call("POST", "/chat/completions", payload)
              print("-" * 62)
              print("[CHAT] model=%s status=%s elapsed=%.1fs" % (m, st, el))
              if st == 200:
                  try:
                      d = json.loads(body)
                      txt = d["choices"][0]["message"]["content"]
                      print("  usage:", json.dumps(d.get("usage"), ensure_ascii=False))
                      print("  回复:", txt[:160].replace("\n", " "))
                      ok.append(m)
                  except Exception as e:
                      print("  解析失败:", e, body[:200])
              else:
                  print("  错误:", body[:300])

          if ok:
              m = ok[0]
              payload = {
                  "model": m,
                  "messages": [
                      {"role": "system", "content": "你是A股分析师，只输出 JSON，不要任何额外文字、不要 markdown 代码块。"},
                      {
                          "role": "user",
                          "content": "股票605100 收盘32.15，涨2.3%，5日均量是20日均量的1.4倍。"
                          '请输出 {"score": 0到100的整数, "stance": "看多或观望或看空", "reason": "30字以内"}',
                      },
                  ],
                  "max_tokens": 300,
                  "temperature": 0.2,
                  "response_format": {"type": "json_object"},
              }
              st, body, el = call("POST", "/chat/completions", payload)
              print("-" * 62)
              print("[JSON] model=%s status=%s elapsed=%.1fs" % (m, st, el))
              if st == 200:
                  try:
                      d = json.loads(body)
                      txt = d["choices"][0]["message"]["content"]
                      print("  usage:", json.dumps(d.get("usage"), ensure_ascii=False))
                      print("  原始输出:", txt[:200].replace("\n", " "))
                      try:
                          parsed = json.loads(txt)
                          print("  JSON 解析: OK ->", json.dumps(parsed, ensure_ascii=False)[:160])
                      except Exception as e:
                          print("  JSON 解析: FAIL ->", e)
                  except Exception as e:
                      print("  响应解析失败:", e, body[:200])
              else:
                  print("  错误:", body[:300])
          else:
              print("-" * 62)
              print("[JSON] 跳过：没有可用的 chat 模型")

          print("=" * 62)
          print("SUMMARY ok_models=%s" % (",".join(ok) if ok else "NONE"))
          PY
